<style>
:root{--accent:#E4324B;--navy:#15233F;--win:#36A85B;--loss:#E5484D;--nr:#8A8A93;
  --c0:#E4324B;--c1:#3B82F6;--c2:#36A85B;--c3:#A855F7;--c4:#E8893C;--c5:#0EA5A5;}
html[data-theme="light"]{
  --bg:#ECECEE;--panel:#FFFFFF;--panel-2:#F7F7F9;--border:rgba(0,0,0,0.09);--soft:rgba(0,0,0,0.05);
  --text:#16213E;--dim:rgba(22,33,62,0.6);--faint:rgba(22,33,62,0.4);--hero:#15233F;
  --chip:#F1F2F4;--divider:rgba(0,0,0,0.08);--ph:#E9EAEE;--ph-ic:rgba(22,33,62,0.25);
  --splat-a:rgba(228,50,75,0.34);--splat-b:rgba(244,68,92,0.18);--radar-grid:rgba(22,33,62,0.16);--handle:#DEDEE2;
}
html[data-theme="dark"]{
  --bg:#08090D;--panel:#13151D;--panel-2:#0F1118;--border:rgba(255,255,255,0.08);--soft:rgba(255,255,255,0.05);
  --text:#F4F5F8;--dim:rgba(244,245,248,0.6);--faint:rgba(244,245,248,0.4);--hero:#FFFFFF;
  --chip:#1B1C24;--divider:rgba(255,255,255,0.08);--ph:#1B1C24;--ph-ic:rgba(255,255,255,0.28);
  --splat-a:rgba(228,50,75,0.45);--splat-b:rgba(244,68,92,0.24);--radar-grid:rgba(255,255,255,0.16);--handle:#23252F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
.serif{font-family:'Bricolage Grotesque',sans-serif}
img{display:block}

.topbar{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);background:var(--panel)}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-logo{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-0.01em}
.tb-logo b{color:var(--accent)}
.tb-sub{font-size:11px;color:var(--faint);letter-spacing:0.04em}
.toggle{display:inline-flex;background:var(--chip);border:1px solid var(--border);border-radius:22px;padding:3px;gap:2px}
.toggle button{border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;padding:7px 11px;border-radius:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
.toggle button.on{background:var(--accent);color:#fff}.toggle svg{width:15px;height:15px}

.app{display:grid;grid-template-columns:var(--lw,380px) 6px 1fr 6px var(--rw,340px);height:calc(100vh - 50px)}
.col{overflow-y:auto;overflow-x:hidden;height:100%}
.handle{background:var(--bg);cursor:col-resize;position:relative}
.handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:30px;background:var(--handle);border-radius:2px}
.handle:hover::after{background:var(--accent)}

/* ---- LEFT: index ---- */
.left{background:var(--panel-2);padding:18px 16px}
.idx-eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px}
.idx-hero{font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:26px;line-height:1;color:var(--hero);margin-bottom:6px}
.idx-rule{width:60px;height:3px;background:var(--accent);border-radius:2px;margin-bottom:18px}
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.tcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;cursor:pointer;padding:10px 11px;transition:border-color .15s,transform .15s;min-width:0}
.tcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.tcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tcard-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;min-width:0}
.tcard-flag{width:34px;height:23px;border-radius:4px;background:var(--ph);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ph-ic);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tcard-flag img{width:100%;height:100%;object-fit:cover}
.tcard-flag svg{width:14px;height:14px}
.tcard-name{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tcard-badges{display:flex;gap:5px;margin-bottom:8px;min-height:19px}
.tcard-badges .b{width:17px;height:19px;color:var(--accent)}
.tcard-badges .b img{width:100%;height:100%;object-fit:contain}
.tcard-badges .b svg{width:17px;height:19px}
.tcard-form{display:flex;gap:3px;align-items:center}
.tcard-form .fl{font-size:8px;font-weight:800;letter-spacing:0.08em;color:var(--faint);margin-right:3px}
.tcard-form .d{width:14px;height:14px;border-radius:50%;font-size:7px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.d.W{background:var(--win)}.d.L{background:var(--loss)}.d.N{background:var(--nr)}

/* ---- CENTER: team ---- */
.center{background:var(--bg);padding:20px 22px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--faint);text-align:center}
.empty svg{width:46px;height:46px}
.ct-head{position:relative;margin-bottom:18px}
.ct-flagbg{position:absolute;top:-20px;right:-12px;width:64%;height:310px;background-size:cover;background-position:center;opacity:.13;border-radius:14px;-webkit-mask-image:linear-gradient(100deg,transparent,#000 50%);mask-image:linear-gradient(100deg,transparent,#000 50%);pointer-events:none}
.ct-flagname{display:flex;align-items:center;gap:12px}
.ct-flag{width:48px;height:34px;border-radius:5px;background:var(--ph);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ph-ic)}
.ct-flag img{width:100%;height:100%;object-fit:cover}.ct-flag svg{width:18px;height:18px}
.ct-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:900;font-size:34px;text-transform:uppercase;color:var(--hero);line-height:1}
.ct-staff{display:flex;gap:26px;margin-top:14px;font-size:12px}
.ct-staff .lbl{color:var(--faint);font-size:10px}.ct-staff .val{font-weight:700}
.ct-wc{display:inline-flex;gap:22px;border:1px solid var(--border);border-radius:10px;padding:8px 18px;margin-top:14px;background:var(--panel)}
.ct-wc .tr{display:flex;flex-direction:column;align-items:center;gap:2px}
.ct-wc .tr .ti{width:26px;height:28px;background:var(--ph);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--ph-ic);font-size:9px;overflow:hidden}
.ct-wc .tr .ti img{width:100%;height:100%;object-fit:contain}
.ct-wc .tr .lab{font-size:9px;color:var(--faint)}.ct-wc .tr .cnt{font-size:12px;font-weight:800}
.ct-hero-img{position:absolute;top:-20px;right:-12px;width:300px;height:380px;pointer-events:none}
.ct-hero-img .splat{position:absolute;inset:0;background:radial-gradient(closest-side at 62% 42%,var(--splat-a),transparent 68%);filter:blur(10px)}
.ct-hero-img img{position:absolute;top:0;right:0;height:100%;width:auto;max-width:135%;object-position:top right}
.ct-hero-img .fb{position:absolute;right:10px;bottom:0;width:150px;height:190px;border:1px dashed var(--border);border-radius:12px;background:var(--ph);display:flex;align-items:center;justify-content:center;color:var(--ph-ic);font-size:11px;text-align:center;padding:8px}
.ct-sub{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint);margin:18px 0 10px}
.ct-form{display:flex;gap:6px;align-items:center}
.ct-form .d{width:24px;height:24px;font-size:10px}
.ct-form .empty-i{font-size:12px;color:var(--faint);font-style:italic}
.ct-badges{display:flex;gap:14px;flex-wrap:wrap}
.ct-badge{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px}
.ct-badge .ic{width:40px;height:44px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.ct-badge .ic img{width:100%;height:100%;object-fit:contain}.ct-badge .ic svg{width:40px;height:44px}
.ct-badge .cap{font-size:10px;text-align:center;color:var(--dim);line-height:1.2}
.ct-about{font-size:12.5px;line-height:1.6;color:var(--dim);white-space:pre-line;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.ct-star{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:visible;margin-top:14px;min-height:170px}
.ct-star .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;position:relative}
.ct-star .role{font-size:12px;color:var(--dim);margin:4px 0 8px;position:relative}
.ct-star .reason{font-size:12.5px;line-height:1.6;color:var(--dim)}
.ct-starfig{float:right;width:212px;height:auto;shape-outside:content-box;shape-image-threshold:.4;shape-margin:14px;margin:-36px -18px 0 16px;position:relative;z-index:1;pointer-events:none}
.ct-splat{position:absolute;top:-26px;right:-22px;width:240px;height:240px;background:radial-gradient(closest-side at 55% 45%,var(--splat-a),transparent 70%);filter:blur(12px);pointer-events:none}
.squad-grp{margin-top:16px}
.squad-grp .gh{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;margin-bottom:8px}
.squad-grp .gh svg{width:14px;height:14px;opacity:.85}
.prow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.prow::-webkit-scrollbar{height:6px}.prow::-webkit-scrollbar-thumb{background:var(--soft);border-radius:3px}
.pchip{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.pchip .av{width:48px;height:48px;border-radius:50%;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ph-ic);font-size:11px;font-weight:700;border:2px solid transparent;transition:border-color .15s}
.pchip:hover .av{border-color:var(--accent)}
.pchip.pinned .av{border-color:var(--accent)}
.pchip .av img{width:100%;height:100%;object-fit:cover}
.pchip .nm{font-size:10px;text-align:center;line-height:1.2}.pchip .nm .c{color:var(--accent);font-weight:700}

/* ---- RIGHT: pinned ---- */
.right{background:var(--panel-2);padding:14px 14px}
.right.drag-over{outline:2px dashed var(--accent);outline-offset:-6px;background:color-mix(in srgb,var(--accent) 7%,var(--panel-2))}
.right-head{margin-bottom:12px}
.rh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.right-head .t{font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--dim)}
.right-head .acts{display:flex;gap:8px;align-items:center}
.right-search{position:relative}
.right-search .rs-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
.right-search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 12px 9px 34px;color:var(--text);font-family:inherit;font-size:12.5px;outline:none}
.right-search input:focus{border-color:var(--accent)}
.rs-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:20;overflow:hidden;display:none;max-height:340px;overflow-y:auto}
.rs-list.on{display:block}
.rs-item{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.rs-item:hover{background:var(--chip)}
.rs-av{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--dim)}
.rs-av img{width:100%;height:100%;object-fit:cover}
.rs-tx{display:flex;flex-direction:column;min-width:0}
.rs-nm{font-size:12.5px;font-weight:700;color:var(--text)}
.rs-meta{font-size:10.5px;color:var(--faint)}
.btn-clear{border:none;background:transparent;color:var(--accent);font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.btn-cmp{border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.04em;padding:6px 14px;border-radius:18px;cursor:pointer;text-transform:uppercase;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-cmp:not(:disabled):hover{filter:brightness(1.08)}
.btn-cmp:disabled{opacity:.4;cursor:default;box-shadow:none}
.pin-empty{color:var(--faint);font-size:12px;text-align:center;padding:40px 16px;line-height:1.7}
.tv-cell{cursor:pointer}.tv-cell:active{cursor:grabbing}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:10px;position:relative}
.pcard-head{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:grab}
.pcard-head:active{cursor:grabbing}
.pcard-grip{flex:none;width:16px;color:var(--faint);display:flex;align-items:center}.pcard-grip svg{width:16px;height:16px}
.pcard-av{width:42px;height:42px;border-radius:50%;background:var(--ph);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ph-ic);font-size:12px;font-weight:700}
.pcard-av img{width:100%;height:100%;object-fit:cover}
.pcard-nm{font-size:13px;font-weight:800;line-height:1.1}
.pcard-meta{font-size:10px;color:var(--dim);margin-top:2px}
.pcard-x{position:absolute;top:10px;right:10px;width:18px;height:18px;border:none;background:transparent;color:var(--faint);cursor:pointer}
.pcard-x svg{width:16px;height:16px}
.vtabs{display:flex;background:var(--chip);border-radius:7px;padding:2px;gap:2px;margin-bottom:8px}
.vtabs button{flex:1;border:none;background:transparent;font-family:inherit;font-size:9px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--dim);padding:5px 0;border-radius:5px;cursor:pointer}
.vtabs button.on{background:var(--navy);color:#fff}
.mini-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mini{background:var(--panel-2);border-radius:6px;padding:6px 4px;text-align:center}
.mini .l{font-size:8.5px;color:var(--faint);text-transform:uppercase;letter-spacing:0.03em}
.mini .v{font-size:13px;font-weight:800;margin-top:1px}
.radar-mini{display:flex;justify-content:center;padding-top:4px}
.rsel{width:100%;font-family:inherit;font-size:10px;font-weight:600;color:var(--text);background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:5px 6px;margin-bottom:6px;cursor:pointer}

/* ---- comparison overlay ---- */
.cmp-backdrop{position:fixed;inset:0;background:rgba(10,12,18,0.62);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 16px;z-index:120}
.cmp-backdrop.show{display:flex}
.cmp-panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:100%;max-width:1480px;padding:26px 30px;position:relative}
.cmp-head h1{font-size:22px;font-weight:800;letter-spacing:0.04em}
.cmp-head .sub{font-size:12.5px;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 0}
.cmp-head .sub span{position:relative;padding:0 12px}
.cmp-head .sub span:first-child{padding-left:0}
.cmp-head .sub span+span::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:3px;border-radius:50%;background:var(--faint)}
.cmp-foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--divider);font-size:11px;color:var(--faint);text-align:center}
.cmp-close{position:absolute;top:22px;right:26px;width:30px;height:30px;border:none;background:transparent;color:var(--dim);cursor:pointer}.cmp-close svg{width:24px;height:24px}
.cmp-body{display:flex;gap:16px;margin-top:18px;align-items:stretch}
.cmp-rail{width:220px;flex-shrink:0;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:16px}
.cmp-rail .lbl{font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--faint);text-transform:uppercase;margin-bottom:9px}
.cmp-vtoggle{display:flex;background:var(--chip);border-radius:8px;padding:3px;margin-bottom:20px}
.cmp-vtoggle button{flex:1;border:none;background:transparent;font-family:inherit;font-size:11px;font-weight:700;color:var(--dim);padding:7px 4px;border-radius:6px;cursor:pointer}
.cmp-vtoggle button.on{background:var(--accent);color:#fff}
.cmp-rail select{width:100%;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 11px;cursor:pointer;margin-bottom:18px}
.cmp-rank .r{display:flex;align-items:center;gap:10px;padding:6px 0}
.cmp-rank .pos{font-size:15px;font-weight:800;width:16px;color:var(--text)}.cmp-rank .nm{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmp-rank .vl{font-size:13px;font-weight:700}
.cmp-cols{display:flex;gap:14px;flex:1;min-width:0;overflow-x:auto;padding-bottom:6px}
.cmp-col{flex:1 1 250px;min-width:250px;max-width:340px;border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;cursor:grab}
.cmp-col:active{cursor:grabbing}
.cmp-col.cmp-dragging{opacity:.4}
.cmp-col-x{position:absolute;top:12px;right:12px;width:20px;height:20px;border:none;background:transparent;color:var(--faint);cursor:pointer;z-index:2}.cmp-col-x svg{width:16px;height:16px}
.cmp-col-head{display:flex;gap:12px;padding-bottom:11px;padding-right:34px;border-bottom:1px solid var(--divider);margin-bottom:9px;min-height:72px;box-sizing:border-box}
.cmp-col-id{min-width:0;display:flex;flex-direction:column;justify-content:center}
.cmp-col-av{width:52px;height:52px;border-radius:50%;background:var(--ph);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ph-ic);font-size:13px;font-weight:700;border:2px solid var(--border)}
.cmp-col-av img{width:100%;height:100%;object-fit:cover}
.cmp-col-nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:16px;line-height:1.12;overflow-wrap:normal;word-break:normal}
.cmp-col-meta{font-size:11px;color:var(--dim);margin-top:4px;display:flex;align-items:center;gap:6px}
.cmp-col-flag{display:inline-flex;width:20px;height:14px;border-radius:2px;overflow:hidden;flex:none}
.cmp-col-flag img,.cmp-col-flag svg{width:20px;height:14px;object-fit:cover}
.cmp-srow{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid var(--divider);font-size:13px;border-radius:6px}
.cmp-srow.active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cmp-srow.active .sl{color:var(--accent);font-weight:700}
.cmp-srow .sl{color:var(--dim)}.cmp-srow .sr{display:flex;align-items:center;gap:8px}.cmp-srow .sv{font-weight:700}

.tv-name{font-size:46px;font-weight:800;line-height:1;color:var(--text);border-bottom:4px solid var(--tp);padding-bottom:6px;display:inline-block;white-space:nowrap}
.tv-inforow{display:flex;gap:18px;align-items:flex-start;margin:16px 0 2px;flex-wrap:nowrap}
.tv-staff{display:flex;flex-direction:column;gap:13px;flex:1;min-width:0}
.tv-staff-i{display:flex;align-items:center;gap:10px}
.tv-staff-i .ico{width:20px;height:20px;color:var(--faint);flex:none}
.tv-staff .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700;line-height:1.2}
.tv-staff .val{font-size:15px;font-weight:800;color:var(--text);line-height:1.2}
.tv-wcbox{border:1px solid var(--border);border-radius:12px;padding:9px 14px 10px;background:var(--panel-2);flex:none;align-self:flex-start}
.tv-wch{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;text-align:center}
.tv-wcrow{display:flex;gap:22px;justify-content:center}
.tv-wctr{display:flex;flex-direction:column;align-items:center;gap:2px}
.tv-wctw{width:36px;height:44px;display:flex;align-items:center;justify-content:center}
.tv-wctw img{width:100%;height:100%;object-fit:contain}
.tv-wccnt{font-size:14px;font-weight:800;color:var(--tp);line-height:1}
.tv-wclab{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);font-weight:700}
.tv-formline{display:flex;align-items:center;gap:9px;margin:10px 0 2px}
.tv-mini{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700}
.form-dots{display:flex;gap:5px}
.fdot{width:23px;height:23px;border-radius:50%;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center}
.fdot.W{background:#2ca35a}.fdot.L{background:#e0413f}.fdot.N{background:#9aa3b0}
.fdot.latest{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--tp)}
.form-latest{font-size:8px;text-transform:uppercase;letter-spacing:.05em;color:var(--tp);font-weight:800}
.tv-badges{display:flex;gap:12px;flex-wrap:nowrap;margin-top:16px}
.tv-badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;flex:none}
.tv-badge .ic{width:46px;height:50px;color:var(--tp)}.tv-badge .ic img{width:100%;height:100%;object-fit:contain}.tv-badge .ic svg{width:100%;height:100%}
.tv-badge .cap{font-size:9.5px;text-align:center;color:var(--dim);line-height:1.15;font-weight:600}
/* body: bios left, squad right */
.tv-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,300px);gap:0;align-items:stretch;padding:22px 24px}
.tv-bio-about{margin-bottom:4px}
.tv-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:visible}
.tv-bios{display:flex;flex-direction:column;gap:18px;min-width:0;padding-right:24px}
.tv-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--tp);margin-bottom:10px}
.tv-bigh{font-size:24px;font-weight:800;color:var(--text);margin-bottom:10px;line-height:1.1}
.tv-about{font-size:13px;line-height:1.62;color:var(--dim);white-space:pre-line}
.tv-starcard{overflow:visible;border-top:1px solid var(--divider);padding-top:20px}
.tv-starfig{float:right;width:200px;height:auto;shape-image-threshold:.4;shape-margin:12px;margin:-46px -16px 0 14px;position:relative;z-index:1;pointer-events:none}
.tv-star-nm{font-size:26px;font-weight:800;line-height:1.08;margin-top:2px}
.tv-star-nm .npart{display:block;white-space:nowrap}
.tv-star-role{font-size:12px;color:var(--tp);font-weight:700;margin:10px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.tv-star-reason{font-size:12.5px;line-height:1.6;color:var(--dim)}
.tv-seestats{margin-top:15px;display:inline-flex;align-items:center;gap:7px;background:none;border:1.5px solid var(--tp);color:var(--tp);font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 17px;border-radius:22px;cursor:pointer;transition:background .15s,color .15s;position:relative;z-index:2}
.tv-seestats:hover{background:var(--tp);color:#fff}
.tv-seestats svg{width:13px;height:13px}
/* squad: three independent horizontal-scroll groups */
.tv-squad{border-left:1px solid var(--divider);padding-left:24px}
.tv-sgrp{margin-top:12px}
.tv-sgrp-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text);font-weight:800;margin:0 0 8px}
.tv-sgrp-h .ct{color:var(--tp)}
.tv-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 6px;padding-bottom:4px}
.tv-cell{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px;min-width:0}
.tv-cell .av{width:50px;height:50px;border-radius:50%;overflow:hidden;background:var(--ph);border:2px solid transparent;transition:border-color .15s}
.tv-cell:hover .av{border-color:var(--tp)}
.tv-cell .av img{width:100%;height:100%;object-fit:cover}
.tv-cell .cn{display:flex;flex-direction:column;align-items:center;line-height:1.12;text-align:center}
.tv-cell .cn .f{font-size:9.5px;color:var(--dim)}
.tv-cell .cn .l{font-size:9.5px;color:var(--text);font-weight:700}
.tv-cell .c{color:var(--tp)}
.tv-cell .mbs{display:flex;gap:2px;height:15px;align-items:center}
.tv-cell .mb{width:15px;height:15px;color:var(--tp)}.tv-cell .mb img{width:100%;height:100%;object-fit:contain}.tv-cell .mb svg{width:100%;height:100%}
@media(max-width:1379px){.tv-head-r{display:none}.tv-head{min-height:0}}
@media(max-width:900px){.tv-body{grid-template-columns:1fr}.tv-bios{padding-right:0}.tv-squad{border-left:none;padding-left:0;border-top:1px solid var(--divider);padding-top:20px;margin-top:20px}.tv-name{font-size:38px}}
.vtoggle{display:inline-flex;border:1px solid var(--border);border-radius:18px;overflow:hidden}
.vtoggle button{background:none;border:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--dim);padding:6px 13px;cursor:pointer}
.vtoggle button.on{background:var(--accent);color:#fff}
a.tb-sub{text-decoration:none}
a.tb-sub:hover{color:var(--accent)}
#tip{position:fixed;z-index:300;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;padding:6px 9px;border-radius:7px;max-width:240px;line-height:1.35;pointer-events:none;opacity:0;transition:opacity .07s;box-shadow:0 4px 14px rgba(0,0,0,.28)}
#tip.show{opacity:1}
body.ov-open #app,body.ov-open #simple{filter:blur(3px);transition:filter .2s;pointer-events:none}
@media(max-width:1299px){.vtoggle{display:none}}
</style>

<body>
<div class="topbar">
  <div class="tb-l"><div class="tb-logo" onclick="goHome()" style="cursor:pointer" title="Back to index">WT20 <b>2026</b></div><a class="tb-sub" href="https://bestofcricket.substack.com/" target="_blank" rel="noopener" onclick="track('substack_click')">A <i>Best of Cricket</i> Dashboard</a></div>
  <div class="tb-r">
    <div class="vtoggle"><button id="vs" onclick="setView('simple')">Simple</button><button id="vd" onclick="setView('detailed')">Detailed</button></div>
    <button class="tb-gloss" onclick="openGlossary()" title="Data glossary — stat & badge definitions">Glossary</button>
    <button class="tb-gloss tb-fb" onclick="openFeedback()">Share Feedback</button>
  <div class="toggle">
    <button id="bl" onclick="setTheme('light')" title="Light mode" aria-label="Light mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button id="bd" class="on" onclick="setTheme('dark')" title="Dark mode" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </div>
  </div>
</div>

<div class="app" id="app">
  <div class="col left" id="left"></div>
  <div class="handle" id="hL"></div>
  <div class="col center" id="center"></div>
  <div class="handle" id="hR"></div>
  <div class="col right" id="right" ondragover="cmpDragOver(event)" ondragleave="cmpDragLeave(event)" ondrop="cmpDrop(event)"></div>
</div>

<div id="simple"></div>

<div id="glossary" class="gloss-overlay" style="display:none" onclick="if(event.target===this)closeGlossary()">
  <div class="gloss-inner">
    <button class="gloss-close" onclick="closeGlossary()" aria-label="Close">&#10005;</button>
    <h1 class="gloss-title serif">Data Glossary</h1>
    <div id="gloss-body"></div>
  </div>
</div>
<div class="pmodal-backdrop" id="pmodal"></div>
<div class="cmp-backdrop" id="cmp"></div>
<div class="note" id="note"></div>
<div class="fb-backdrop" id="fb" onclick="if(event.target===this)closeFeedback()">
  <div class="fb-card">
    <button class="fb-close" onclick="closeFeedback()" aria-label="Close">&#10005;</button>
    <div id="fb-form-wrap">
      <h2 class="fb-title">Share Feedback</h2>
      <p class="fb-intro">Spotted a bug, want a feature, or just have thoughts? Let me know.</p>
      <label class="fb-label" for="fb-comment">Comment <span class="req">*</span></label>
      <textarea class="fb-textarea" id="fb-comment" placeholder="What's on your mind?"></textarea>
      <label class="fb-label" for="fb-name">Name <span style="color:var(--faint)">(optional)</span></label>
      <input class="fb-input" id="fb-name" type="text" placeholder="Your name">
      <label class="fb-label" for="fb-email">Email <span style="color:var(--faint)">(optional)</span></label>
      <input class="fb-input" id="fb-email" type="email" placeholder="you@example.com">
      <input class="fb-hp" id="fb-website" tabindex="-1" autocomplete="off" aria-hidden="true" placeholder="Leave this blank">
      <div class="fb-err" id="fb-err"></div>
      <button class="fb-send" id="fb-send" onclick="submitFeedback()">Send</button>
      <p class="fb-privacy">We'll only use your contact details to follow up on your feedback.</p>
    </div>

      <h3>Thanks for the feedback!</h3>
      <p>It's been received and I appreciate you taking the time.</p>
    </div>
  </div>
</div>

<script>
const ASSETS='assets';
const slug=n=>n.replace(/^The\s+/i,'').toLowerCase().replace(/\s+/g,'_');
const BATTER_ROLES=['Top Order Bat','Middle Order Bat','Finisher','Wicket Keeper'];
const BOWLER_ROLES=['Pacer','Spinner'];
const num=(v,d=0)=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):v);
const COLORS=['var(--c0)','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const COLORHEX=['#E4324B','#3B82F6','#36A85B','#A855F7','#E8893C','#0EA5A5'];

const BAT_AXES=[
  {k:'radar_batting_sr',label:'Bat SR Rank',base:'Bat SR',inv:false},
  {k:'radar_first_10_sr',label:'10Ball SR Rank',base:'10Ball SR',inv:false},
  {k:'radar_nbsr',label:'NBSR Rank',base:'NBSR',inv:false},
  {k:'radar_sr_edge',label:'SR Edge Rank',base:'SR Edge',inv:false},
  {k:'batting_average',label:'Average Rank',base:'Average',inv:false,src:'stat'}];
const BOWL_AXES=[
  {k:'bowling_sr',label:'Bowl SR Rank',base:'Bowl SR',inv:true,src:'stat'},
  {k:'top7_bowling_sr',label:'Top7 SR Rank',base:'Top7 SR',inv:true},
  {k:'radar_wicket_edge',label:'Wkt Edge Rank',base:'Wkt Edge',inv:false},
  {k:'radar_econ_edge',label:'Econ Edge Rank',base:'Econ Edge',inv:false},
  {k:'radar_economy',label:'Econ Rank',base:'Econ',inv:true}];

let DATA, RANGES={}, state={team:null,pins:[],views:{},radarMode:{}};

function isBowler(p){return BOWLER_ROLES.includes(p.role);}
function isAllrounder(p){return p.role==='All-Rounder';}
function inBattingPop(p){return BATTER_ROLES.includes(p.role)||p.role==='All-Rounder';}
function inBowlingPop(p){return BOWLER_ROLES.includes(p.role)||p.role==='All-Rounder';}
function axVal(p,a){return a.src==='stat'?(p.pre_wc_stats&&p.pre_wc_stats[a.k]):(p.graph_data&&p.graph_data[a.k]);}
function lastName(p){const t=(p.name||'').trim().split(/\s+/);return t[t.length-1]||p.name;}
function btypeOf(p){return p.bowling_type&&p.bowling_type!=='N/A'?p.bowling_type:null;}
function roleLabel(p){return p.role==='Spinner'&&btypeOf(p)?btypeOf(p):p.role;}
let PCTL={};
function computePercentiles(){
  const batPop=DATA.players.filter(inBattingPop),bowlPop=DATA.players.filter(inBowlingPop);
  BAT_AXES.forEach(a=>{PCTL[a.k]=batPop.map(p=>axVal(p,a)).filter(v=>v!=null).sort((x,y)=>x-y);});
  BOWL_AXES.forEach(a=>{PCTL[a.k]=bowlPop.map(p=>axVal(p,a)).filter(v=>v!=null).sort((x,y)=>x-y);});
}
function pctOf(p,a){
  const v=axVal(p,a);if(v==null)return null;
  const arr=PCTL[a.k];if(!arr||!arr.length)return null;
  let below=0;for(const x of arr){if(x<v)below++;}
  let pc=below/arr.length*100; if(a.inv)pc=100-pc;
  return Math.round(Math.max(1,Math.min(100,pc)));
}
function computeRanges(){
  [...BAT_AXES,...BOWL_AXES].forEach(a=>{
    const vs=DATA.players.map(p=>axVal(p,a)).filter(v=>v!=null);
    if(vs.length)RANGES[a.k]=[Math.min(...vs),Math.max(...vs)];
  });
}
function radarData(p,mode){
  const axes=mode==='bowling'?BOWL_AXES:BAT_AXES;
  return axes.map(a=>{const pc=pctOf(p,a);return {label:a.label,base:a.base,val:pc==null?0:pc,pct:pc};});
}
function defaultRadarMode(p){return isBowler(p)?'bowling':'batting';}

function setTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('bd').classList.toggle('on',t==='dark');document.getElementById('bl').classList.toggle('on',t==='light');renderAll();track('theme_switch',{theme:t});}

/* asset helpers */
function _flagFB(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V4M4 4h12l-2 4 2 4H4"/></svg>`.replace(/"/g,'&quot;');}
function flagWavy(team,cls){return `<img class="${cls||''}" src="${ASSETS}/wavy_flags/${slug(team.name)}.png" onerror="this.outerHTML='${_flagFB()}'">`;}
function flagFlat(team,cls){return `<img class="${cls||''}" src="${team.flag_url||''}" onerror="this.outerHTML='${_flagFB()}'">`;}
const BADGES_META={
 'Serial Winners':{x:'Proven on the biggest stage.',y:'Has won at least five World Cups across formats.'},
 'Veterans':{x:'A seasoned squad.',y:'Median age over 30.'},
 'Peaking':{x:'A squad in its prime.',y:'Median age 26\u201329.'},
 'Rookies':{x:'A young squad.',y:'Median age under 25.'},
 'Accumulators':{x:'Score a lot of runs.',y:'One of the top 3 teams by average runs scored.'},
 'Chasers':{x:'Can chase down any target.',y:'One of the top 3 teams by successful chases.'},
 'Wicket-takers':{x:'Can decimate your batters.',y:'One of the top 3 teams at average wickets taken.'},
 'In Form':{x:'No one can beat them.',y:'At least 7 wins in their last 10 games.'},
 'Out of Form':{x:"They can't beat anyone.",y:'Fewer than 3 wins in their last 10 games.'},
 'Anchor':{x:'Bats long and steady.',y:'Above average balls faced at a below average strike rate for their position.'},
 'Fast Starter':{x:'Among the quickest off the blocks.',y:'Top 10% strike rate in their first 10 balls.'},
 'Slow Starter':{x:'Takes time to settle.',y:'Bottom 10% strike rate in their first 10 balls.'},
 'Powerplay Specialist':{x:'Gives their team a quick start.',y:'Top 10% for strike rate and average in overs 1\u20136.'},
 'Finisher':{x:'Gives their team a big finish.',y:'Top 10% for strike rate and average in overs 16\u201320.'},
 'Speed Demon':{x:'One of the fastest pacers.',y:'Can bowl above 125 kph deliveries.'},
 'Wicket Threat':{x:'Takes wickets often.',y:'Best 10% bowling strike rate (min 10 wickets).'},
 'Stingy':{x:"Doesn't concede runs.",y:'Best 10% economy (min 5 innings).'},
 'Expensive':{x:'Concedes too many runs.',y:'Worst 10% economy (min 5 innings).'},
 'Serial Winner':{x:'A proven winner.',y:'5+ major trophies in their career.'},
 'Key Player':{x:'A statistical team leader.',y:'Leads their team in runs or wickets.'},
 'Key All-Rounder':{x:'Above average bowler and batter.',y:'Top 3 on their team in both runs and wickets.'}
};
const BADGE_INFO=Object.fromEntries(Object.entries(BADGES_META).map(([k,v])=>[k,v.x]));
function badgeFile(name){return (name||'').toLowerCase().replace(/[\s\-]+/g,'_');}
const BADGE_OVERRIDE={team:{wicket_takers:'wicket_threat',veterans:'veteran'}};
function badgeImg(b,kind){
  let fn=badgeFile(b.name); const ov=(BADGE_OVERRIDE[kind]||{}); if(ov[fn])fn=ov[fn];
  const folder=kind==='team'?'team':'players';
  const desc=(BADGES_META[b.name]||{}).y||BADGE_INFO[b.name]||'';
  const title=(desc||b.name).replace(/"/g,'&quot;');
  const hex=`<svg viewBox="0 0 40 44"><path d="M20 2 L37 11 L37 33 L20 42 L3 33 L3 11 Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`.replace(/"/g,'&quot;');
  return `<span class="bdg-tip" data-tip="${title}" style="display:inline-flex;width:100%;height:100%;cursor:help"><img src="${ASSETS}/badges/${folder}/${fn}.png" onerror="this.outerHTML='${hex}'"></span>`;
}
function photoImg(p){const init=p.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<img src="${p.photo_url}" onerror="this.outerHTML='${init}'">`;}

/* ---------- LEFT ---------- */
function renderLeft(){
  const cards=DATA.teams.map(t=>{
    const sl=slug(t.name);
    const badges=t.badges.map(b=>`<div class="b">${badgeImg(b,'team')}</div>`).join('');
    const form=t.form.slice(-5).map(f=>{const c=f.result==='win'?'W':f.result==='loss'?'L':'N';return `<div class="d ${c}">${c==='N'?'':c}</div>`;}).join('');
    return `<div class="tcard ${state.team&&state.team.id===t.id?'sel':''}" onclick="selectTeam('${t.id}')">
      <div class="tcard-top"><span class="tcard-flag">${flagWavy(t)}</span><span class="tcard-name">${t.name}</span></div>
      <div class="tcard-badges">${badges}</div>
      <div class="tcard-form"><span class="fl">Form</span>${form}</div>
    </div>`;
  }).join('');
  document.getElementById('left').innerHTML=`
    <div class="idx-eyebrow">Teams</div>
    <div class="idx-grid">${cards}</div>`;
}

/* ---------- CENTER ---------- */
function selectTeam(id){state.team=DATA.teams.find(t=>t.id===id);renderLeft();renderCenter();track('team_view',{team:state.team?state.team.name:id,mode:'detailed'});}
// ===== Per-team palette (tuned to pop on dark default) =====
const TEAM_COLORS={
 australia:{p:'#e0a92a',s:'#0a3d62'}, bangladesh:{p:'#1ea672',s:'#e63946'},
 england:{p:'#e63946',s:'#1d3557'}, india:{p:'#2f78e6',s:'#13399a'},
 ireland:{p:'#13a884',s:'#f59e2c'}, netherlands:{p:'#f2622e',s:'#2b50a0'},
 new_zealand:{p:'#4f9fe0',s:'#d62839'}, pakistan:{p:'#15a85a',s:'#cdb87a'},
 scotland:{p:'#3d8fe6',s:'#16305c'}, south_africa:{p:'#e0a92a',s:'#137a4a'},
 sri_lanka:{p:'#ef8a17',s:'#9e2a4d'}, west_indies:{p:'#d11f44',s:'#f2c829'}
};
function teamPal(t){return TEAM_COLORS[slug(t.name)]||{p:'#E4324B',s:'#15233F'};}
function captainFig(t){const sl=slug(t.name);return `<img class="tv-cap" src="${ASSETS}/captains/${sl}.png" onerror="this.style.display='none'">`;}
const BOWL_TYPE_MAP={'Pace':'Pacer','Fast':'Pacer','Off Spin':'Off-spin','Leg Spin':'Leg-spin','Left-Arm Orthodox':'Left-arm orthodox','Left-Arm Wrist Spin':'Left-arm wrist-spin','Left Arm Orthodox':'Left-arm orthodox'};
function roleSub(p){if(!p)return '';const r=p.role;if(r==='All-Rounder')return 'All-Rounder';
  if(BOWLER_ROLES.includes(r)){const bt=(p.bowling_type||'').trim();return BOWL_TYPE_MAP[bt]||bt||r;} return r;}
function trophiesRow(t){const items=[['odi_wc','ODI WC',t.odi_wc_titles],['t20_wc','T20 WC',t.t20_wc_titles]];
  return items.map(([k,lab,n])=>`<div class="trophy"><div class="tw"><img src="${ASSETS}/trophies/${k}.png" onerror="this.outerHTML='${lab}'"><span class="tn">×${n}</span></div><span class="tl">${lab}</span></div>`).join('');}
function wcWinsHTML(t){const items=[['odi_wc','ODI WC',t.odi_wc_titles],['t20_wc','T20 WC',t.t20_wc_titles]];
  return items.map(([k,lab,n])=>`<div class="tv-wctr"><div class="tv-wctw"><img src="${ASSETS}/trophies/${k}.png" onerror="this.outerHTML='&lt;span style=&quot;font-size:8px;color:var(--faint)&quot;&gt;${lab}&lt;/span&gt;'"></div><div class="tv-wccnt">×${n||0}</div><div class="tv-wclab">${lab}</div></div>`).join('');}

/* ---------- RADAR ---------- */
function radarSVG(items,color,W,highlight,subjectLast){
  const N=items.length,cx=W/2,cy=W/2-4,R=W*0.27;
  const cs=getComputedStyle(document.documentElement),grid=cs.getPropertyValue('--radar-grid').trim(),txt=cs.getPropertyValue('--dim').trim(),acc=cs.getPropertyValue('--accent').trim();
  const fillSafe=hexToRgba(color,0.18);
  const padX=Math.max(12,Math.round(80-0.23*W));
  const pt=(i,rr)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];};
  let s=`<svg viewBox="${-padX} -2 ${W+2*padX} ${W+4}" width="${W+2*padX}" style="max-width:100%;height:auto">`;
  [0.5,1].forEach(g=>{s+=`<polygon points="${items.map((_,i)=>pt(i,R*g).join(',')).join(' ')}" fill="none" stroke="${grid}" stroke-width="1"/>`;});
  items.forEach((_,i)=>{const[x,y]=pt(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${grid}" stroke-width="1"/>`;});
  s+=`<polygon points="${items.map((it,i)=>pt(i,R*it.val/100).join(',')).join(' ')}" fill="${fillSafe}" stroke="${color}" stroke-width="2"/>`;
  items.forEach((it,i)=>{const[x,y]=pt(i,R*it.val/100);s+=`<circle cx="${x}" cy="${y}" r="2.5" fill="${color}"/>`;});
  items.forEach((it,i)=>{const[lx,ly]=pt(i,R+16);const an=Math.abs(lx-cx)<6?'middle':(lx<cx?'end':'start');
    const hot=highlight&&it.label===highlight;
    const info=(subjectLast&&it.base)?`${subjectLast}'s ${it.base} percentile rank amongst all WC players.`:'';
    const lc=hot?acc:txt;
    const deco=info?` text-decoration="underline" style="text-decoration-style:dotted;text-decoration-color:${hot?acc:'#7a8194'};cursor:help"`:'';
    s+=`<text x="${lx}" y="${ly-4}" text-anchor="${an}" font-size="9" font-weight="${hot?700:400}" fill="${lc}" font-family="Inter,sans-serif" dominant-baseline="middle"${info?` data-tip="${info.replace(/"/g,'&quot;')}"`:''}${deco}>${it.label}</text>`;
    if(it.pct!=null)s+=`<text x="${lx}" y="${ly+7}" text-anchor="${an}" font-size="10" font-weight="800" fill="${hot?acc:color}" font-family="Inter,sans-serif" dominant-baseline="middle">${it.pct}</text>`;});
  return s+`</svg>`;
}
function hexToRgba(h,a){if(h.startsWith('#')){const n=parseInt(h.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}return h;}

function renderCompare(){

  const rankFor=(key,inv)=>{const arr=players.map((p,i)=>({i,v:cmpVal(p,key)})).filter(o=>o.v!=null);arr.sort((a,b)=>inv?a.v-b.v:b.v-a.v);const m={};arr.forEach((o,idx)=>m[o.i]=idx+1);return {m,n:arr.length};};
  const ranks={};stats.forEach(s=>ranks[s[1]]=rankFor(s[1],s[3]));
  const rb=stats.find(s=>s[1]===cmpRankBy);
  const order=players.map((p,i)=>({i,v:cmpVal(p,rb[1])})).filter(o=>o.v!=null).sort((a,b)=>rb[3]?a.v-b.v:b.v-a.v);

        <div class="lbl">Add player</div>
        <div class="right-search" style="margin-bottom:4px"><svg class="rs-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="cmp-sinput" placeholder="Search\u2026" value="${cmpSearch.replace(/"/g,'&quot;')}" oninput="cmpSearchInput(this.value)"><div id="cmp-sresults" class="rs-list"></div></div>
        <div class="lbl">Rank by</div>
        <select onchange="setCmpRank(this.value)">${stats.map(s=>`<option value="${s[1]}" ${s[1]===cmpRankBy?'selected':''}>${s[0]}</option>`).join('')}</select>
        <div class="cmp-rank">${order.map((o,idx)=>{const pal=teamPal(teamOf(players[o.i]));return `<div class="r"><span class="pos">${idx+1}</span><span class="nm" style="color:${pal.p}">${players[o.i].name}</span><span class="vl">${num(o.v,rb[2])}</span></div>`;}).join('')}</div>
      </div>
      <div class="cmp-cols" ondragover="cmpSortOver(event)" ondrop="event.preventDefault()">${players.map((p,i)=>{
        const pal=teamPal(teamOf(p));

          let pill='';if(v!=null&&r&&n>1){if(r===1)pill=`<span class="pill best">1</span>`;else if(r===n)pill=`<span class="pill worst">${r}</span>`;}
          const act=s[1]===cmpRankBy?' active':'';
          return `<div class="cmp-srow${act}"><span class="sl" data-tip="${(STAT_INFO[s[0]]||'').replace(/"/g,'&quot;')}" style="${STAT_INFO[s[0]]?'cursor:help;border-bottom:1px dotted var(--faint)':''}">${s[0]}</span><span class="sr"><span class="sv">${num(v,s[2])}</span>${pill}</span></div>`;}).join('');
        const mode=cmpRole;
        return `<div class="cmp-col" data-pid="${p.id}" draggable="true" ondragstart="cmpSortStart(event)" ondragend="cmpSortEnd(event)">
          <button class="cmp-col-x" onclick="removeFromCompare('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

    <div class="cmp-foot">Inter-World Cup period performances only</div>
  </div>`;
  fillCmpResults();
}

function initResize(){
  const app=document.getElementById('app');
  function drag(handle,which){
    handle.addEventListener('mousedown',e=>{e.preventDefault();const sx=e.clientX;const cs=getComputedStyle(app);const lw=parseFloat(cs.getPropertyValue('--lw')||'300');const rw=parseFloat(cs.getPropertyValue('--rw')||'340');
      function mv(ev){const dx=ev.clientX-sx;if(which==='L'){app.style.setProperty('--lw',Math.max(200,Math.min(520,lw+dx))+'px');}else{app.style.setProperty('--rw',Math.max(240,Math.min(560,rw-dx))+'px');}}
      function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
  }
  drag(document.getElementById('hL'),'L');drag(document.getElementById('hR'),'R');
}

const TEAM_BADGE_NAMES=['Serial Winners','Veterans','Peaking','Rookies','Accumulators','Chasers','Wicket-takers','In Form','Out of Form'];
const PLAYER_BADGE_NAMES=['Anchor','Fast Starter','Slow Starter','Powerplay Specialist','Finisher','Speed Demon','Wicket Threat','Stingy','Expensive','Serial Winner','Key Player','Key All-Rounder'];
const ADV_STATS_GLOSS=[
 ['First-10 SR','Strike rate across the first 10 balls a batter faces \u2014 how quickly they get going.'],
 ['Non-Boundary SR','Strike rate from runs other than boundaries \u2014 how well they rotate strike and run hard.'],
 ['Balls per Boundary','How many balls a batter faces, on average, between boundaries.'],
 ['Dot % (batting)','Share of balls faced that are dots (no run scored). Lower is better.'],
 ['SR Edge','How often a batter scored faster than their team\u2019s run rate while at the crease. 0.50 means quicker than the team in half their innings. Higher is better.'],
 ['Powerplay SR','Strike rate in the powerplay (overs 1\u20136).'],
 ['Economy','Runs conceded per over, excluding byes and leg-byes. Lower is better.'],
 ['Dot % (bowling)','Share of legal deliveries that are dots. Higher is better for a bowler.'],
 ['Boundary Runs / Over','Boundary runs conceded per over. Lower is better.'],
 ['Econ Edge','How often a bowler was more economical than their team in the same match. 0.50 means better than the team in half their innings. Higher is better.'],
 ['Wicket Edge','How often a bowler struck more frequently than their team. 0.50 means a better strike rate than the team in half their innings. Higher is better.'],
 ['3WI','Innings in which a bowler took three or more wickets.']
];
const GRAPH_STATS_GLOSS=[
 ['Batting radar','Five batting strengths, each scaled across every player at the tournament so the shape shows a profile at a glance: Strike Rate, First-10 SR (fast starts), Non-Boundary SR (running between the wickets), SR Edge (scoring faster than teammates) and Dot % (kept low).'],
 ['Bowling radar','Five bowling strengths, scaled across every bowler: Economy (kept low), Dot % (kept high), Econ Edge and Wicket Edge (beating teammates on runs and wickets) and how often they take key wickets.'],
 ['Scaling','Radar values are normalised across all players in the tournament, so a larger shape always means a stronger profile and players can be compared directly.']
];
function glossRow(n,d,icon){return `<div class="gloss-row"><div class="n">${icon?`<span class="gloss-ic">${icon}</span>`:''}${n}</div><div class="d">${d}</div></div>`;}
function renderGlossary(){
  let h='<div class="gloss-note">Data from Cricsheet. Player data covers all T20s since the last T20 World Cup.</div><div class="gloss-note">The Relative Profile radar graphs measure the percentile rank of players compared to all other cricketers at the World Cup. All data in the radar graphs are from the inter-World Cup period only.</div>';
  h+='<div class="gloss-sub">Badges</div><div class="gloss-sub2">Team badges</div>';
  h+=TEAM_BADGE_NAMES.map(n=>glossRow(n,(BADGES_META[n]||{}).y||'',badgeImg({name:n},'team'))).join('');
  h+='<div class="gloss-sub2">Player badges</div>';
  h+=PLAYER_BADGE_NAMES.map(n=>glossRow(n,(BADGES_META[n]||{}).y||'',badgeImg({name:n},'player'))).join('');
  h+='<div class="gloss-sub">Advanced Stats</div>'+ADV_STATS_GLOSS.map(([n,d])=>glossRow(n,d)).join('');
  h+='<div class="gloss-sub">Graph Stats</div>'+GRAPH_STATS_GLOSS.map(([n,d])=>glossRow(n,d)).join('');

/* ---- player modal (profile) ---- */
function pmEffMode(p){return isAllrounder(p)?pm.mode:(isBowler(p)?'bowling':'batting');}
function captainOf(p,t){return !!(t&&((t.captain_id!=null&&String(t.captain_id)===String(p.id))||t.captain===p.name));}
function pmVal(p,key,src){if(key==='top7_bowling_sr')return pm.range==='pre'?(p.graph_data||{}).top7_bowling_sr:null;return (src||{})[key];}
function pmStatList(p){
  const bowl=pmEffMode(p)==='bowling';
  return {
    basic:bowl?[['Innings','innings_bowled',0],['Wickets','wickets',0],['Economy','economy',2],['Average','bowling_average',1],['SR','bowling_sr',1],['3WI','three_wicket_hauls',0]]
              :[['Innings','innings_batted',0],['Runs','runs',0],['Average','batting_average',1],['Bat SR','batting_sr',1],['50+','fifties_plus',0],['HS','highest_score',0]],
    advanced:bowl?[['Top7 Wkt','top7_wickets',0],['Top7 SR','top7_bowling_sr',1],['Wicket Edge','wicket_edge',2],['Dot %','bowling_dot_pct',1],['Bdry/Over','boundary_runs_per_over',2],['Econ Edge','econ_edge',2]]
                 :[['10Ball SR','first_10_ball_sr',1],['PP SR','powerplay_sr',1],['SR Edge','sr_edge',2],['Balls/Bdry','balls_per_boundary',1],['Dot %','dot_pct',1],['NBSR','non_boundary_sr',1]]
  }[pm.view];
}
function pmTiles(p){
  const src=pm.range==='wc'?p.wc_stats:p.pre_wc_stats;
  const tip=k=>STAT_INFO[k]?` data-tip="${STAT_INFO[k].replace(/"/g,'&quot;')}" style="cursor:help;border-bottom:1px dotted var(--faint)"`:'';
  return `<div class="pm-tiles">${pmStatList(p).map(c=>`<div class="pm-tile"><div class="l"><span${tip(c[0])}>${c[0]}</span></div><div class="v">${num(pmVal(p,c[1],src),c[2])}</div></div>`).join('')}</div>`;
}
function openPlayer(id){pm.pid=id;pm.view='basic';pm.range='pre';pm.mode=defaultRadarMode(DATA.players.find(p=>p.id===id));document.getElementById('pmodal').classList.add('show');document.body.classList.add('ov-open');renderPlayerModal();const pl=DATA.players.find(p=>p.id===id);track('player_view',{player:pl?pl.name:id});}
function closePlayer(){document.getElementById('pmodal').classList.remove('show');document.body.classList.remove('ov-open');}
function setPmView(v){pm.view=v;renderPlayerModal();track('profile_view_switch',{view:v});}
function setPmMode(m){pm.mode=m;renderPlayerModal();track('profile_discipline_switch',{discipline:m});}
function setPmRange(r){pm.range=r;renderPlayerModal();track('profile_range_switch',{range:r});}
function renderPlayerModal(){
  const p=DATA.players.find(x=>x.id===pm.pid),t=teamOf(p),pal=t?teamPal(t):{p:'#E4324B'};
  const cap=captainOf(p,t);
  const badges=(p.badges||[]).map(b=>`<div class="pm-badge"><div class="c">${badgeImg(b,'player')}</div><div class="l">${b.name}</div></div>`).join('');
  const trWon=[['T20 WC','t20_wc',p.t20_wc_titles],['ODI WC','odi_wc',p.odi_wc_titles],['WPL','wpl',p.wpl_titles],['Hundred','hundred',p.hundred_titles],['WBBL','wbbl',p.wbbl_titles]].filter(x=>x[2]>0)
    .map(x=>`<div class="pm-htr"><div class="i"><img src="${ASSETS}/trophies/${x[1]}.png" onerror="this.outerHTML='&#127942;'"></div><div class="l">${x[0]}</div><div class="c">×${x[2]}</div></div>`).join('');
  const btRow=(badges||trWon)?`<div class="pm-bt">${badges}${badges&&trWon?'<div class="pm-bt-div"></div>':''}${trWon}</div>`:'';
  const bowl=pmEffMode(p)==='bowling';
  const bbToggle=isAllrounder(p)?`<div class="pm-seg"><button class="${pm.mode==='batting'?'on':''}" onclick="setPmMode('batting')">Batting</button><button class="${pm.mode==='bowling'?'on':''}" onclick="setPmMode('bowling')">Bowling</button></div>`:'';
  const rangeToggle=`<div class="pm-seg"><button class="${pm.range==='pre'?'on':''}" onclick="setPmRange('pre')">Since Last WC</button><button class="${pm.range==='wc'?'on':''}" onclick="setPmRange('wc')">WC Stats</button></div>`;
  const bt=btypeOf(p);
  const metaParts=[];if(cap)metaParts.push('Captain');metaParts.push(roleLabel(p));if(isAllrounder(p)&&bt)metaParts.push(bt);
  metaParts.push(p.batting_hand==='LHB'?'Left-Hand Bat':'Right-Hand Bat');metaParts.push('Age '+p.age);
  const meta=metaParts.join(' · ');
  const radarBox=`<div class="pm-relhead">Relative Profile</div><div class="pm-relsub">${p.name}'s percentile rank on advanced ${bowl?'bowling':'batting'} metrics over the inter–World Cup period, versus all other players at the tournament.</div>${radarSVG(radarData(p,pmEffMode(p)),pal.p,260,null,lastName(p))}`;
  document.getElementById('pmodal').innerHTML=`<div class="pmodal">
    <button class="pm-close" onclick="closePlayer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="pm-head">
      <div class="pm-photo" style="border-color:${pal.p}">${photoImg(p)}</div>
      <div style="flex:1;min-width:0">
        <div class="pm-name serif" style="color:${pal.p}">${p.name}<span class="pm-flag">${t?flagFlat(t):''}</span>${isStar(p)?'<svg class="pm-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.8 20.9l1.6-6.8L2.2 9.5l6.9-.6z"/></svg>':''}</div>
        <div class="pm-meta">${meta}</div>
        ${btRow}
      </div>
    </div>
    <div class="pm-grid">
      <div class="pm-left">
        <div class="pm-controls">
          <div class="pm-tabs"><div class="pm-tab ${pm.view==='basic'?'on':''}" onclick="setPmView('basic')">Basic</div><div class="pm-tab ${pm.view==='advanced'?'on':''}" onclick="setPmView('advanced')">Advanced</div></div>
          <div class="pm-toggles">${bbToggle}${rangeToggle}</div>
        </div>
        ${pmTiles(p)}
      </div>
      <div class="pm-vdiv"></div>
      <div class="pm-right">${radarBox}</div>
    </div>
    <div class="pm-foot">Data as per last update on Cricsheet.</div>
  </div>`;
}

/* ========== BOOT / RESPONSIVE ========== */
let mode=null,resizeAttached=false,modeOverride='simple';
function track(event, params){if(window.gtag)gtag('event',event,params||{});}
function setView(v){modeOverride=v;mode=null;applyMode();track('view_mode_switch',{mode:v});}
function updateViewToggle(){const vd=document.getElementById('vd'),vs=document.getElementById('vs');if(vd){vd.classList.toggle('on',mode==='detailed');vs.classList.toggle('on',mode==='simple');}}
function applyMode(){
  let m;
  if(modeOverride){m=modeOverride;if(m==='detailed'&&window.innerWidth<1300)m='simple';}
  else{m=window.innerWidth>=1300?'detailed':'simple';}
  if(m!==mode){
    mode=m;
    document.getElementById('app').style.display=m==='detailed'?'grid':'none';
    document.getElementById('simple').style.display=m==='simple'?'block':'none';
    if(m==='detailed'){renderAll();if(!resizeAttached){initResize();resizeAttached=true;}}
    else{renderSimple();}
  }
  updateViewToggle();
}
async function init(){
  DATA=await (await fetch('data.json')).json();
  const sortKey=n=>n.replace(/^The\s+/i,'').toLowerCase();
  DATA.teams.sort((a,b)=>sortKey(a.name)<sortKey(b.name)?-1:1);
  computeRanges();
  computePercentiles();
  state.team=DATA.teams.find(t=>t.name==='Australia')||DATA.teams[0];
  applyMode();
  let tmr;window.addEventListener('resize',()=>{clearTimeout(tmr);tmr=setTimeout(applyMode,150);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePlayer();closeCompare();closeGlossary();closeFeedback();}});
  if(location.hash==='#glossary')openGlossary();
  window.addEventListener('hashchange',()=>{if(location.hash==='#glossary')openGlossary();});
  document.getElementById('pmodal').addEventListener('click',e=>{if(e.target.id==='pmodal')closePlayer();});
  document.getElementById('cmp').addEventListener('click',e=>{if(e.target.id==='cmp')closeCompare();});
  const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
  document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&el.getAttribute('data-tip')){tip.textContent=el.getAttribute('data-tip');tip.classList.add('show');}});
  document.addEventListener('mousemove',e=>{if(tip.classList.contains('show')){let x=e.clientX+14,y=e.clientY+16;if(x+tip.offsetWidth>innerWidth-8)x=e.clientX-tip.offsetWidth-12;if(y+tip.offsetHeight>innerHeight-8)y=e.clientY-tip.offsetHeight-14;tip.style.left=x+'px';tip.style.top=y+'px';}});
  document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)tip.classList.remove('show');});
}
init();
